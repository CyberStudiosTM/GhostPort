[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ghostport"
dynamic = ["version"]
description = "A tiny forensic CLI for diagnosing local TCP ports and unexpected HTTP services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "CyberStudios" }]
keywords = ["cli", "ports", "diagnostics", "http", "localhost", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/CyberStudiosTM/GhostPort"
Issues = "https://github.com/CyberStudiosTM/GhostPort/issues"

[project.scripts]
ghostport = "ghostport.cli:main"

[tool.hatch.version]
path = "src/ghostport/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PT018"]
